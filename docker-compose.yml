version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chorus
      POSTGRES_USER: chorus
      POSTGRES_PASSWORD: chorus_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/src/main/resources/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot server (REST API + Gateway + Voice via external Tomcat)
  server:
    build: ./server
    ports:
      - "4001:8080"  # REST API (Tomcat 端口映射到 4001)
      - "4002:8080"  # Gateway WS (Tomcat 同一端口)
      - "4003:4003/udp"  # Voice UDP
      - "4004:4004"  # Voice WS
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://postgres:5432/chorus
      - DB_USER=chorus
      - DB_PASSWORD=chorus_dev_2026

  # React frontend (dev mode with hot reload)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./client/src:/app/src
    depends_on:
      - server
    environment:
      # Vite 环境变量（VITE_ 前缀）。VITE_BACKEND_URL 指向 compose 网络内的 server 容器；
      # Gateway 直连宿主机映射端口 4002，避免经 Vite 代理导致 resume_gateway_url 反射成容器内网地址。
      - VITE_BACKEND_URL=http://server:8080
      - VITE_GATEWAY_URL=ws://localhost:4002/chorus/ws
      - VITE_NO_OPEN=1

volumes:
  pgdata:
