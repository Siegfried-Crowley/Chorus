name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wording:
    name: Wording compliance (对外口径检查)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 拦截"自称复现/对标 Discord"类表述、口径不一致与旧数字残留
      - name: Install python-docx (docx 成品也在检查范围内)
        run: pip install python-docx

      - name: Check wording
        run: python tools/check-wording.py

  backend:
    name: Backend src (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 测试用 H2 内存库,零外部依赖;现场(MySQL)与 docker(H2/PG)配置不参与 CI
      - name: Run backend tests (src)
        run: mvn -B test

  server-tree:
    name: Backend server tree (mvn test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # server/ 是 Docker 部署用的独立 Maven 工程(经 sync.bat 从 src 同步)
      - name: Run backend tests (server)
        working-directory: ./server
        run: mvn -B test

  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Type-check frontend (tsc)
        working-directory: ./client
        run: npx tsc --noEmit

      - name: Run frontend tests
        working-directory: ./client
        run: npm test
